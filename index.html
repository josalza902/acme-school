<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Acme School</title>
  <link rel="stylesheet" href="css/estilos1.css">
</head>
<body>
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" required placeholder="Introduce tu correo electrónico">
      
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required placeholder="Introduce tu contraseña">
      
      <button type="submit">Iniciar sesión</button>
    </form>
    <p id="error-message" style="color:red; display:none;">Credenciales inválidas. Por favor, intenta de nuevo.</p>
  </div>

  <script src="js/main.js"></script> 
</body>
</html>
